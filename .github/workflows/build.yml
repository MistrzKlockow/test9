name: Build MineProgress
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skonfiguruj Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Zbuduj plugin
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Udostępnij JAR
        uses: actions/upload-artifact@v4
        with:
          name: MineProgress-0.9.1
          path: target/MineProgress-0.9.1.jar
          if-no-files-found: error
          retention-days: 14
